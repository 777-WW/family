<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家帳本</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7;--surface:#FFF;--surface2:#EAEDF2;--border:#D8DCE6;
  --text:#181C26;--text2:#5A607A;--text3:#9AA0B8;
  --blue:#2D5BE3;--blue-l:#EBF0FD;--green:#1B8A5A;--green-l:#E6F4EE;
  --red:#C0392B;--red-l:#FDECEA;--mono:'IBM Plex Mono',monospace;
  --sans:'Noto Sans TC',sans-serif;--r:12px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151C;--surface:#1E2130;--surface2:#252A3A;--border:#2E3450;
  --text:#E8EAF2;--text2:#8890B0;--text3:#4A5070;
  --blue:#5B82F5;--blue-l:#1A2448;--green:#2AB87A;--green-l:#122B20;
  --red:#E05A47;--red-l:#2E1510;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:101}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--surface);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:17px;font-weight:700}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border-radius:99px;padding:3px 12px 3px 3px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uname{font-size:13px;font-weight:500;color:var(--text2);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;cursor:pointer;color:var(--text3);font-size:11px;transition:color .15s}
.bnav-item.active{color:var(--blue)}
.bnav-icon{font-size:20px;line-height:1}
main{max-width:600px;margin:0 auto;padding:20px 16px calc(72px + env(safe-area-inset-bottom,0px))}
.asset-hero{text-align:center;padding:28px 0 24px}
.asset-label{font-size:13px;color:var(--text3);font-weight:500;margin-bottom:6px}
.asset-total{font-size:38px;font-family:var(--mono);font-weight:500;letter-spacing:-1px}
.asset-delta{font-size:13px;margin-top:6px;color:var(--text3)}
.up{color:var(--green)}.dn{color:var(--red)}
.accs{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.acc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .1s}
.acc-card:hover{background:var(--surface2)}
.acc-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.acc-info{flex:1}.acc-name{font-size:14px;font-weight:600}.acc-type{font-size:12px;color:var(--text3)}
.acc-bal{font-family:var(--mono);font-size:16px;font-weight:500}.acc-bal.neg{color:var(--red)}
.add-btn{border:1.5px dashed var(--border);border-radius:var(--r);padding:12px;text-align:center;font-size:13px;color:var(--text3);cursor:pointer;background:none;width:100%;transition:all .15s}
.add-btn:hover{border-color:var(--blue);color:var(--blue)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:13px;font-weight:600;color:var(--text2)}
.month-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.month-bar h2{flex:1;font-size:15px;font-weight:600}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.icon-btn:hover{background:var(--surface2)}.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.summary-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.scard-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:2px}
.scard-val{font-size:19px;font-family:var(--mono);font-weight:500}
.scard-val.inc{color:var(--green)}.scard-val.exp{color:var(--red)}
.ftabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ftab{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .12s}
.ftab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tx-group{margin-bottom:16px}
.tx-date-hdr{font-size:12px;color:var(--text3);font-weight:600;padding:4px 0 6px}
.tx-item{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:3px;cursor:pointer;transition:background .1s}
.tx-item:hover{background:var(--surface2)}
.tx-cat-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-body{flex:1;min-width:0}.tx-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text3);display:flex;gap:5px;align-items:center;margin-top:1px;flex-wrap:wrap}
.tx-acc-tag{background:var(--surface2);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:500}
.tx-amt{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap;text-align:right}
.tx-amt.inc{color:var(--green)}.tx-amt.exp{color:var(--red)}.tx-amt.xfr{color:var(--text3)}
.empty-state{text-align:center;padding:48px 16px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.fab{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom,0px));right:18px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(45,91,227,.35);cursor:pointer;z-index:50;transition:transform .1s}
.fab:hover{transform:scale(1.06)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:560px){.backdrop{align-items:center}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:22px 20px;max-height:90vh;overflow-y:auto}
@media(min-width:560px){.modal{border-radius:16px}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-hdr h3{font-size:16px;font-weight:700}
.close-btn{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:none;cursor:pointer;font-size:15px;color:var(--text2)}
.type-row{display:flex;gap:6px;margin-bottom:16px}
.type-btn{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .12s}
.type-btn.on-inc{background:var(--green-l);border-color:var(--green);color:var(--green)}
.type-btn.on-exp{background:var(--red-l);border-color:var(--red);color:var(--red)}
.type-btn.on-xfr{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.fgrp{margin-bottom:14px}
.flabel{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px}
.finput{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .12s}
.finput:focus{border-color:var(--blue)}.finput.mono{font-family:var(--mono)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-btn{border-radius:9px;background:var(--surface2);border:1.5px solid var(--border);cursor:pointer;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;transition:all .12s}
.cat-btn .cn{font-size:11px;color:var(--text2);font-family:var(--sans);font-weight:500;line-height:1}
.cat-btn.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 0 0 2px var(--blue)}
.cat-btn.sel .cn{color:var(--blue)}
.submit-btn{width:100%;padding:13px;border-radius:9px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:6px}
.submit-btn:disabled{opacity:.45;cursor:not-allowed}
.del-btn{width:100%;padding:11px;border-radius:9px;background:transparent;color:var(--red);font-size:14px;font-weight:600;border:1.5px solid var(--red);cursor:pointer;margin-top:7px}
.del-btn:hover{background:var(--red-l)}
.hint{font-size:12px;color:var(--text3);margin-top:4px}
.loading{text-align:center;padding:60px;color:var(--text3);font-size:14px}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1C1C1C;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 54px)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;max-width:360px;width:100%;text-align:center}
.login-icon{font-size:44px;margin-bottom:14px}
.login-card h2{font-size:20px;font-weight:700;margin-bottom:8px}
.login-card p{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.8}
.pw-error{color:var(--red);font-size:13px;margin-bottom:10px;display:none}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo">🏡 家帳本</div>
    <div id="user-area"></div>
  </header>
  <main id="main"><div class="loading">載入中…</div></main>
  <nav class="bnav" id="bnav" style="display:none">
    <div class="bnav-item active" id="tab-assets" onclick="switchTab('assets')"><div class="bnav-icon">🏦</div>資產</div>
    <div class="bnav-item" id="tab-txs" onclick="switchTab('txs')"><div class="bnav-icon">📋</div>記帳</div>
    <div class="bnav-item" id="tab-stats" onclick="switchTab('stats')"><div class="bnav-icon">📊</div>統計</div>
  </nav>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDKO-ajmZavBzkSIFJ4tFERTeQh6IfkOHc",
  authDomain: "family-budget-fda7b.firebaseapp.com",
  projectId: "family-budget-fda7b",
  storageBucket: "family-budget-fda7b.firebasestorage.app",
  messagingSenderId: "736951783389",
  appId: "1:736951783389:web:9bd244b07e142097637034"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── 密碼（改這裡）──────────────────────────────────────
const APP_PASSWORD = '2610';

// ── helpers ───────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return 'NT$'+Math.abs(Number(n)||0).toLocaleString('zh-TW',{maximumFractionDigits:0}); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now(); }
function showToast(msg,dur=2200){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),dur); }
function fmtDateLabel(s){
  if(!s) return ''; s=String(s).substring(0,10);
  const [y,mo,d]=s.split('-').map(Number); if(!y||!mo||!d) return s;
  const dt=new Date(y,mo-1,d);
  const wd=['日','一','二','三','四','五','六'][dt.getDay()];
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((dt-now)/86400000);
  if(diff===0) return `今天（週${wd}）`;
  if(diff===-1) return `昨天（週${wd}）`;
  return `${mo}月${d}日（週${wd}）`;
}
function cleanDate(s){ return s?String(s).substring(0,10):''; }

// ── 分類 ──────────────────────────────────────────────
const CATS={
  expense:[
    {id:'food',icon:'🍱',name:'餐飲'},{id:'transport',icon:'🚌',name:'交通'},
    {id:'shop',icon:'🛒',name:'購物'},{id:'medical',icon:'💊',name:'醫療'},
    {id:'edu',icon:'📚',name:'教育'},{id:'fun',icon:'🎮',name:'娛樂'},
    {id:'home',icon:'🏠',name:'居家'},{id:'beauty',icon:'💄',name:'美妝'},
    {id:'pet',icon:'🐾',name:'寵物'},{id:'other',icon:'📦',name:'其他'},
  ],
  income:[
    {id:'salary',icon:'💼',name:'薪水'},{id:'bonus',icon:'🎁',name:'獎金'},
    {id:'invest',icon:'📈',name:'投資'},{id:'side',icon:'🛠️',name:'兼職'},
    {id:'gift',icon:'🧧',name:'紅包'},{id:'other_i',icon:'✨',name:'其他'},
  ]
};
function catById(id){ return [...CATS.expense,...CATS.income].find(c=>c.id===id)||{icon:'📦',name:'其他'}; }

const ACC_TYPES=[
  {id:'bank',icon:'🏦',label:'銀行帳戶',bg:'#EBF0FD'},
  {id:'cash',icon:'💵',label:'現金',bg:'#E6F4EE'},
  {id:'card',icon:'💳',label:'信用卡',bg:'#FFF3E0'},
  {id:'invest',icon:'📈',label:'投資帳戶',bg:'#F3E5F5'},
  {id:'other',icon:'📂',label:'其他',bg:'#EAEDF2'},
];
function accTypeById(id){ return ACC_TYPES.find(t=>t.id===id)||ACC_TYPES[4]; }

// ── state ─────────────────────────────────────────────
const S={
  user:null, accounts:[], txs:[],
  tab:'assets',
  txYear:new Date().getFullYear(), txMonth:new Date().getMonth()+1,
  txFilter:'all',
};

// ── computed ──────────────────────────────────────────
function accountBalance(accId){
  const acc=S.accounts.find(a=>a.id===accId); if(!acc) return 0;
  let bal=Number(acc.initBalance)||0;
  for(const t of S.txs){
    const amt=Number(t.amount)||0;
    if(t.type==='inc'&&t.accountId===accId) bal+=amt;
    if(t.type==='exp'&&t.accountId===accId) bal-=amt;
    if(t.type==='xfr'&&t.accountId===accId) bal-=amt;
    if(t.type==='xfr'&&t.toAccountId===accId) bal+=amt;
  }
  return bal;
}
function totalAssets(){ return S.accounts.reduce((s,a)=>s+accountBalance(a.id),0); }
function monthTxs(){
  const mk=monthKey(S.txYear,S.txMonth);
  return S.txs.filter(t=>cleanDate(t.date).startsWith(mk));
}

// ── 登入 ──────────────────────────────────────────────
function renderLogin(step){
  document.getElementById('bnav').style.display='none';
  const isPw = step!=='name';
  document.getElementById('main').innerHTML=`
    <div id="login-screen"><div class="login-card">
      <div class="login-icon">🏡</div>
      <h2>家帳本</h2>
      ${isPw
        ?`<p>請輸入家庭密碼</p>
          <div class="fgrp"><input class="finput" id="pw-input" type="password" placeholder="密碼"
            onkeydown="if(event.key==='Enter')checkPw()"></div>
          <div class="pw-error" id="pw-err">密碼錯誤，請再試一次</div>
          <button class="submit-btn" onclick="checkPw()">進入</button>`
        :`<p>請輸入你的名字<br><span style="font-size:12px;color:var(--text3)">之後帳本會顯示是誰記的帳</span></p>
          <div class="fgrp"><input class="finput" id="name-input" placeholder="例：爸爸、媽媽、阿嬤"
            onkeydown="if(event.key==='Enter')submitName()"></div>
          <button class="submit-btn" onclick="submitName()">開始使用</button>`
      }
    </div></div>`;
  setTimeout(()=>document.getElementById(isPw?'pw-input':'name-input')?.focus(),100);
}

function checkPw(){
  const pw=document.getElementById('pw-input')?.value;
  if(pw===APP_PASSWORD){
    sessionStorage.setItem('fb_auth','1');
    const saved=localStorage.getItem('fb_user');
    if(saved){ try{ S.user=JSON.parse(saved); startApp(); return; }catch(e){} }
    renderLogin('name');
  } else {
    document.getElementById('pw-err').style.display='block';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}
function submitName(){
  const name=document.getElementById('name-input')?.value.trim();
  if(!name){ showToast('請輸入名字'); return; }
  const user={name, id:uuid()};
  localStorage.setItem('fb_user', JSON.stringify(user));
  S.user=user;
  startApp();
}
function checkAuth(){
  if(sessionStorage.getItem('fb_auth')!=='1') return false;
  const saved=localStorage.getItem('fb_user');
  if(saved){ try{ S.user=JSON.parse(saved); return true; }catch(e){} }
  return false;
}

// ── init ──────────────────────────────────────────────
async function init(){
  if(!checkAuth()){ renderLogin('password'); return; }
  document.getElementById('user-area').innerHTML=`
    <div class="user-chip">
      <div class="avatar">${esc((S.user.name||'我')[0])}</div>
      <span class="uname">${esc(S.user.name)}</span>
    </div>`;
  document.getElementById('main').innerHTML='<div class="loading">載入中…</div>';
  await loadAll();
  document.getElementById('bnav').style.display='flex';
  render();
}

async function startApp(){
  document.getElementById('user-area').innerHTML=`
    <div class="user-chip">
      <div class="avatar">${esc((S.user.name||'我')[0])}</div>
      <span class="uname">${esc(S.user.name)}</span>
    </div>`;
  document.getElementById('main').innerHTML='<div class="loading">載入中…</div>';
  await loadAll();
  document.getElementById('bnav').style.display='flex';
  render();
}

// ── Firebase 讀寫 ──────────────────────────────────────
async function loadAll(){
  try{
    const [aSnap, tSnap] = await Promise.all([
      getDocs(collection(db,'accounts')),
      getDocs(collection(db,'txs')),
    ]);
    S.accounts = aSnap.docs.map(d=>({id:d.id,...d.data()}));
    S.txs = tSnap.docs.map(d=>({id:d.id,...d.data()}));
    S.txs.sort((a,b)=>cleanDate(b.date).localeCompare(cleanDate(a.date))||(b.createdAt||0)-(a.createdAt||0));
  }catch(e){ showToast('載入失敗：'+e.message,3000); }
}

// ── 路由 ──────────────────────────────────────────────
function switchTab(tab){
  S.tab=tab;
  ['assets','txs','stats'].forEach(t=>document.getElementById('tab-'+t)?.classList.toggle('active',t===tab));
  render();
}
function render(){
  if(S.tab==='assets') renderAssets();
  else if(S.tab==='txs') renderTxs();
  else renderStats();
}

// ── 資產頁 ────────────────────────────────────────────
function renderAssets(){
  const total=totalAssets();
  const mk=monthKey(new Date().getFullYear(),new Date().getMonth()+1);
  const mTxs=S.txs.filter(t=>cleanDate(t.date).startsWith(mk));
  const mInc=mTxs.filter(t=>t.type==='inc').reduce((s,t)=>s+Number(t.amount),0);
  const mExp=mTxs.filter(t=>t.type==='exp').reduce((s,t)=>s+Number(t.amount),0);
  const mNet=mInc-mExp;
  const accCards=S.accounts.map(a=>{
    const bal=accountBalance(a.id); const at=accTypeById(a.type);
    return `<div class="acc-card" onclick="openAccDetail('${esc(a.id)}')">
      <div class="acc-icon" style="background:${at.bg}">${at.icon}</div>
      <div class="acc-info"><div class="acc-name">${esc(a.name)}</div><div class="acc-type">${at.label}</div></div>
      <div class="acc-bal ${bal<0?'neg':''}">${bal<0?'-':''}${fmt(bal)}</div>
    </div>`;
  }).join('');

// ── 記帳頁 ────────────────────────────────────────────
function renderTxs(){
  const now=new Date();
  const isCurrent=S.txYear===now.getFullYear()&&S.txMonth===now.getMonth()+1;
  let list=monthTxs();
  if(S.txFilter!=='all') list=list.filter(t=>t.type===S.txFilter);
  const allInc=monthTxs().filter(t=>t.type==='inc').reduce((s,t)=>s+Number(t.amount),0);
  const allExp=monthTxs().filter(t=>t.type==='exp').reduce((s,t)=>s+Number(t.amount),0);
  const byDate={};
  for(const t of list){ const d=cleanDate(t.date); if(!byDate[d]) byDate[d]=[]; byDate[d].push(t); }
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  const txHtml=dates.length===0
    ?`<div class="empty-state"><div class="empty-icon">📭</div><p>這個月還沒有記錄<br>點右下角 ＋ 開始記帳</p></div>`
    :dates.map(date=>{
        const rows=byDate[date].map(t=>{
          const cat=catById(t.category||'');
          const acc=S.accounts.find(a=>a.id===t.accountId);
          const toAcc=t.toAccountId?S.accounts.find(a=>a.id===t.toAccountId):null;
          let amt,cls,iconBg;
          if(t.type==='xfr'){amt='↔ '+fmt(t.amount);cls='xfr';iconBg='var(--blue-l)';}
          else if(t.type==='inc'){amt='＋'+fmt(t.amount);cls='inc';iconBg='var(--green-l)';}
          else{amt='－'+fmt(t.amount);cls='exp';iconBg='var(--red-l)';}
          const accLabel=t.type==='xfr'
            ?`${esc(acc?.name||'?')} → ${esc(toAcc?.name||'?')}`
            :esc(acc?.name||'未知帳戶');
          return `<div class="tx-item" onclick="openTxDetail('${esc(t.id)}')">
            <div class="tx-cat-icon" style="background:${iconBg}">${t.type==='xfr'?'↔':cat.icon}</div>
            <div class="tx-body">
              <div class="tx-desc">${esc(t.desc||(t.type==='xfr'?'轉帳':cat.name))}</div>
              <div class="tx-meta">
                ${t.type!=='xfr'?`<span>${cat.name}</span>`:''}
                <span class="tx-acc-tag">${accLabel}</span>
                ${t.userName?`<span>${esc(t.userName)}</span>`:''}
              </div>
            </div>
            <div class="tx-amt ${cls}">${amt}</div>
          </div>`;
        }).join('');
        return `<div class="tx-group"><div class="tx-date-hdr">${fmtDateLabel(date)}</div>${rows}</div>`;
      }).join('');
  document.getElementById('main').innerHTML=`
    <div class="month-bar">
      <button class="icon-btn" onclick="chMonth(-1)">‹</button>
      <h2>${S.txYear} 年 ${S.txMonth} 月</h2>
      <button class="icon-btn" onclick="chMonth(1)" ${isCurrent?'disabled':''}>›</button>
    </div>
    <div class="summary-strip">
      <div class="scard"><div class="scard-label">收入</div><div class="scard-val inc">${fmt(allInc)}</div></div>
      <div class="scard"><div class="scard-label">支出</div><div class="scard-val exp">${fmt(allExp)}</div></div>
    </div>
    <div class="ftabs">
      <div class="ftab ${S.txFilter==='all'?'active':''}" onclick="setFilter('all')">全部</div>
      <div class="ftab ${S.txFilter==='inc'?'active':''}" onclick="setFilter('inc')">收入</div>
      <div class="ftab ${S.txFilter==='exp'?'active':''}" onclick="setFilter('exp')">支出</div>
      <div class="ftab ${S.txFilter==='xfr'?'active':''}" onclick="setFilter('xfr')">轉帳</div>
    </div>
    ${txHtml}
    <div class="fab" onclick="openTxModal()">＋</div>`;
}

function chMonth(d){
  S.txMonth+=d;
  if(S.txMonth>12){S.txMonth=1;S.txYear++;}
  if(S.txMonth<1){S.txMonth=12;S.txYear--;}
  renderTxs();
}
function setFilter(f){ S.txFilter=f; renderTxs(); }

async function saveTx(){
  const amount=parseFloat(document.getElementById('tx-amount')?.value);
  const accId=document.getElementById('tx-acc')?.value;
  const toAccId=_txType==='xfr'?document.getElementById('tx-acc-to')?.value:null;
  const desc=document.getElementById('tx-desc')?.value.trim();
  const date=document.getElementById('tx-date')?.value;
  const catId=document.querySelector('.cat-btn.sel')?.dataset.id||'other';
  if(!amount||amount<=0){ showToast('請輸入金額'); return; }
  if(!accId){ showToast('請選擇帳戶'); return; }
  if(_txType==='xfr'&&toAccId===accId){ showToast('轉出和轉入帳戶不能相同'); return; }
  if(!date){ showToast('請選擇日期'); return; }
  const btn=document.getElementById('tx-submit'); if(btn) btn.disabled=true;
  const data={
    type:_txType, amount, accountId:accId,
    toAccountId:toAccId||'', desc:desc||'', date,
    category:_txType!=='xfr'?catId:'',
    userId:S.user.id, userName:S.user.name, createdAt:Date.now()
  };
  try{
    const ref=await addDoc(collection(db,'txs'),data);
    S.txs.unshift({id:ref.id,...data});
    S.txs.sort((a,b)=>cleanDate(b.date).localeCompare(cleanDate(a.date))||(b.createdAt||0)-(a.createdAt||0));

  const data={
    type:_txType, amount, accountId:accId,
    toAccountId:toAccId||'', desc:desc||'', date,
    category:_txType!=='xfr'?catId:'',

// ── 統計頁 ────────────────────────────────────────────
function renderStats(){
  const now=new Date();
  const isCurrent=S.txYear===now.getFullYear()&&S.txMonth===now.getMonth()+1;
  const mTxs=monthTxs();
  const expTxs=mTxs.filter(t=>t.type==='exp');
  const incTxs=mTxs.filter(t=>t.type==='inc');
  const totalExp=expTxs.reduce((s,t)=>s+Number(t.amount),0);
  const totalInc=incTxs.reduce((s,t)=>s+Number(t.amount),0);
  function groupByCat(txs,total){
    const map={};
    for(const t of txs) map[t.category]=(map[t.category]||0)+Number(t.amount);
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([id,amt])=>({
      cat:catById(id), amt, pct:total>0?Math.round(amt/total*100):0
    }));
  }
  function catRows(groups,color){
    if(!groups.length) return '<div style="color:var(--text3);font-size:13px;padding:8px 0">無資料</div>';
    return groups.map(g=>`
      <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:18px;width:24px;text-align:center">${g.cat.icon}</span>
        <span style="flex:1;font-size:13px">${g.cat.name}</span>
        <div style="width:72px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden">
          <div style="width:${g.pct}%;height:100%;background:${color};border-radius:99px"></div>
        </div>
        <span style="font-family:var(--mono);font-size:12px;color:var(--text2);width:76px;text-align:right">${fmt(g.amt)}</span>
      </div>`).join('');
  }
  const bars=[];
  for(let i=5;i>=0;i--){
    let y=S.txYear,m=S.txMonth-i; while(m<1){m+=12;y--;}
    const mk2=monthKey(y,m);
    const inc=S.txs.filter(t=>cleanDate(t.date).startsWith(mk2)&&t.type==='inc').reduce((s,t)=>s+Number(t.amount),0);
    const exp=S.txs.filter(t=>cleanDate(t.date).startsWith(mk2)&&t.type==='exp').reduce((s,t)=>s+Number(t.amount),0);
    bars.push({label:`${m}月`,inc,exp,net:inc-exp});
  }
  const maxVal=Math.max(...bars.map(b=>Math.max(b.inc,b.exp)),1);
  const barHtml=bars.map(b=>{
    const hi=Math.round(b.inc/maxVal*60); const he=Math.round(b.exp/maxVal*60);
    const nc=b.net>=0?'var(--green)':'var(--red)';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1">
      <div style="font-size:9px;color:${nc};font-family:var(--mono)">${b.net!==0?(b.net>=0?'+':'-')+Math.round(Math.abs(b.net)/1000)+'k':''}</div>
      <div style="display:flex;align-items:flex-end;gap:2px;height:60px">
        <div style="width:10px;background:var(--green);border-radius:3px 3px 0 0;height:${hi}px;opacity:.75"></div>
        <div style="width:10px;background:var(--red);border-radius:3px 3px 0 0;height:${he}px;opacity:.75"></div>
      </div>
      <div style="font-size:10px;color:var(--text3)">${b.label}</div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
    <div class="month-bar">
      <button class="icon-btn" onclick="chMonth(-1);S.tab='stats';renderStats()">‹</button>
      <h2>${S.txYear} 年 ${S.txMonth} 月</h2>
      <button class="icon-btn" onclick="chMonth(1);S.tab='stats';renderStats()" ${isCurrent?'disabled':''}>›</button>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:14px">近六個月收支</div>
      <div style="display:flex;gap:4px;align-items:flex-end">${barHtml}</div>
      <div style="display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--text3)">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--green);opacity:.75;margin-right:4px"></span>收入</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--red);opacity:.75;margin-right:4px"></span>支出</span>
      </div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px">支出分類（共 ${fmt(totalExp)}）</div>
      ${catRows(groupByCat(expTxs,totalExp),'var(--red)')}
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px">收入分類（共 ${fmt(totalInc)}）</div>
      ${catRows(groupByCat(incTxs,totalInc),'var(--green)')}
    </div>`;
}

// ── 工具函式 ──────────────────────────────────────────
function mkBackdrop(id){
  document.getElementById(id)?.remove();
  const bd=document.createElement('div');
  bd.className='backdrop'; bd.id=id;
  bd.onclick=e=>{ if(e.target===bd) bd.remove(); };
  return bd;
}

// 把函式掛到 window 讓 HTML onclick 可以呼叫
Object.assign(window,{
  switchTab,checkPw,submitName,
  openAccModal,saveAcc,deleteAcc,openAccDetail,
  openTxModal,openTxDetail,openEditTx,deleteTx,saveTx,saveEditTx,
  setTxType,selCat,chMonth,setFilter,renderStats,
});

init();
</script>
</body>
</html>
