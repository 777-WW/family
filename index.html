<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家帳本</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7;--surface:#FFF;--surface2:#EAEDF2;--border:#D8DCE6;
  --text:#181C26;--text2:#5A607A;--text3:#9AA0B8;
  --blue:#2D5BE3;--blue-l:#EBF0FD;--green:#1B8A5A;--green-l:#E6F4EE;
  --red:#C0392B;--red-l:#FDECEA;--stk:#7B3FA8;--stk-l:#F3E8FA;--mono:'IBM Plex Mono',monospace;
  --sans:'Noto Sans TC',sans-serif;--r:12px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13151C;--surface:#1E2130;--surface2:#252A3A;--border:#2E3450;
  --text:#E8EAF2;--text2:#8890B0;--text3:#4A5070;
  --blue:#5B82F5;--blue-l:#1A2448;--green:#2AB87A;--green-l:#122B20;
  --red:#E05A47;--red-l:#2E1510;--stk:#B98AE0;--stk-l:#2A1C36;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:101}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--surface);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{font-size:17px;font-weight:700}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--surface2);border-radius:99px;padding:3px 12px 3px 3px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.uname{font-size:13px;font-weight:500;color:var(--text2);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;cursor:pointer;color:var(--text3);font-size:11px;transition:color .15s}
.bnav-item.active{color:var(--blue)}
.bnav-icon{font-size:20px;line-height:1}
main{max-width:600px;margin:0 auto;padding:20px 16px calc(72px + env(safe-area-inset-bottom,0px))}
.asset-hero{text-align:center;padding:28px 0 24px}
.asset-label{font-size:13px;color:var(--text3);font-weight:500;margin-bottom:6px}
.asset-total{font-size:38px;font-family:var(--mono);font-weight:500;letter-spacing:-1px}
.asset-total.neg{color:var(--red)}
.asset-split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.asset-delta{font-size:13px;margin-top:12px;color:var(--text3)}
.up{color:var(--green)}.dn{color:var(--red)}
.accs{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.acc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .1s}
.acc-card:hover{background:var(--surface2)}
.acc-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.acc-info{flex:1}.acc-name{font-size:14px;font-weight:600}.acc-type{font-size:12px;color:var(--text3)}
.acc-bal{font-family:var(--mono);font-size:16px;font-weight:500}.acc-bal.neg{color:var(--red)}
.add-btn{border:1.5px dashed var(--border);border-radius:var(--r);padding:12px;text-align:center;font-size:13px;color:var(--text3);cursor:pointer;background:none;width:100%;transition:all .15s}
.add-btn:hover{border-color:var(--blue);color:var(--blue)}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-title{font-size:13px;font-weight:600;color:var(--text2)}
.month-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.month-bar h2{flex:1;font-size:15px;font-weight:600}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--text)}
.icon-btn:hover{background:var(--surface2)}.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.summary-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:left}
.scard-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:2px}
.scard-val{font-size:19px;font-family:var(--mono);font-weight:500}
.scard-val.inc{color:var(--green)}.scard-val.exp{color:var(--red)}.scard-val.stk{color:var(--stk)}
.three{grid-template-columns:repeat(3,1fr)!important}
.three .scard{padding:10px}
.three .scard-val{font-size:15px;overflow-wrap:anywhere}
.ftabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ftab{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .12s}
.ftab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.ftab.stk.active{background:var(--stk);border-color:var(--stk)}
.tx-group{margin-bottom:16px}
.tx-date-hdr{font-size:12px;color:var(--text3);font-weight:600;padding:4px 0 6px}
.tx-item{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:11px 13px;display:flex;align-items:center;gap:11px;margin-bottom:3px;cursor:pointer;transition:background .1s}
.tx-item:hover{background:var(--surface2)}
.tx-cat-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-body{flex:1;min-width:0}.tx-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text3);display:flex;gap:5px;align-items:center;margin-top:1px;flex-wrap:wrap}
.tx-acc-tag{background:var(--surface2);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:500}
.tx-amt{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap;text-align:right}
.tx-amt.inc{color:var(--green)}.tx-amt.exp{color:var(--red)}.tx-amt.xfr{color:var(--text3)}.tx-amt.stk{color:var(--stk)}
.empty-state{text-align:center;padding:48px 16px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:10px}
.fab{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom,0px));right:18px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(45,91,227,.35);cursor:pointer;z-index:50;transition:transform .1s}
.fab:hover{transform:scale(1.06)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:560px){.backdrop{align-items:center}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:22px 20px;max-height:90vh;overflow-y:auto}
@media(min-width:560px){.modal{border-radius:16px}}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-hdr h3{font-size:16px;font-weight:700}
.close-btn{width:28px;height:28px;border-radius:50%;background:var(--surface2);border:none;cursor:pointer;font-size:15px;color:var(--text2)}
.type-row{display:flex;gap:6px;margin-bottom:16px}
.type-btn{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .12s}
.type-btn.on-inc{background:var(--green-l);border-color:var(--green);color:var(--green)}
.type-btn.on-exp{background:var(--red-l);border-color:var(--red);color:var(--red)}
.type-btn.on-xfr{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.type-btn.on-stk{background:var(--stk-l);border-color:var(--stk);color:var(--stk)}
.stk-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stk-btn{border-radius:9px;background:var(--surface2);border:1.5px solid var(--border);cursor:pointer;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:20px;color:var(--text);font-family:var(--sans)}
.stk-btn .cn{font-size:13px;font-weight:600;color:var(--text2)}
.stk-btn.sel{border-color:var(--stk);background:var(--stk-l);box-shadow:0 0 0 2px var(--stk)}
.stk-btn.sel .cn{color:var(--stk)}
.stk-hint{font-size:12px;color:var(--stk);background:var(--stk-l);border-radius:8px;padding:7px 10px;margin-top:8px}
.notice{background:var(--surface2);border-radius:9px;padding:14px;font-size:13px;color:var(--text2);text-align:center;margin-bottom:14px}
.notice button{margin-top:10px;padding:8px 16px;border-radius:8px;border:none;background:var(--stk);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.fgrp{margin-bottom:14px}
.flabel{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px}
.finput{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .12s}
.finput:focus{border-color:var(--blue)}.finput.mono{font-family:var(--mono)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat-btn{border-radius:9px;background:var(--surface2);border:1.5px solid var(--border);cursor:pointer;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;transition:all .12s}
.cat-btn .cn{font-size:11px;color:var(--text2);font-family:var(--sans);font-weight:500;line-height:1}
.cat-btn.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 0 0 2px var(--blue)}
.cat-btn.sel .cn{color:var(--blue)}
.submit-btn{width:100%;padding:13px;border-radius:9px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:6px}
.submit-btn:disabled{opacity:.45;cursor:not-allowed}
.del-btn{width:100%;padding:11px;border-radius:9px;background:transparent;color:var(--red);font-size:14px;font-weight:600;border:1.5px solid var(--red);cursor:pointer;margin-top:7px}
.del-btn:hover{background:var(--red-l)}
.ghost-btn{width:100%;padding:11px;border-radius:9px;background:transparent;color:var(--text2);font-size:14px;font-weight:600;border:1.5px solid var(--border);cursor:pointer;margin-top:7px}
.hint{font-size:12px;color:var(--text3);margin-top:4px}
.calc-disp{border:1.5px solid var(--blue);border-radius:8px;padding:8px 13px;background:var(--surface);text-align:right;cursor:pointer;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.calc-expr{font-family:var(--mono);font-size:22px;font-weight:500;word-break:break-all;line-height:1.3}
.calc-expr.ph{color:var(--text3)}
.calc-res{font-family:var(--mono);font-size:13px;color:var(--text3);min-height:17px;line-height:1.3}
.calc-pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.calc-pad.hide{display:none}
.ck{height:46px;border-radius:9px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--mono);font-size:19px;font-weight:500;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ck:active{filter:brightness(.92)}
.ck.op{background:var(--blue-l);color:var(--blue);border-color:transparent;font-size:21px}
.ck.fn{color:var(--text2);font-family:var(--sans);font-size:15px}
.ck.eq{background:var(--blue);color:#fff;border-color:transparent}
.loading{text-align:center;padding:60px;color:var(--text3);font-size:14px}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1C1C1C;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 140px)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;max-width:360px;width:100%;text-align:center}
.login-icon{font-size:44px;margin-bottom:14px}
.login-card h2{font-size:20px;font-weight:700;margin-bottom:8px}
.login-card p{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.8;word-break:break-all}
.pw-error{color:var(--red);font-size:13px;margin-bottom:10px;display:none}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="logo">🏡 家帳本</div>
    <div id="user-area"></div>
  </header>
  <main id="main"><div class="loading">載入中…</div></main>
  <nav class="bnav" id="bnav" style="display:none">
    <div class="bnav-item active" id="tab-assets" onclick="switchTab('assets')"><div class="bnav-icon">🏦</div>資產</div>
    <div class="bnav-item" id="tab-txs" onclick="switchTab('txs')"><div class="bnav-icon">📋</div>記帳</div>
    <div class="bnav-item" id="tab-stats" onclick="switchTab('stats')"><div class="bnav-icon">📊</div>統計</div>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDKO-ajmZavBzkSIFJ4tFERTeQh6IfkOHc",
  authDomain: "family-budget-fda7b.firebaseapp.com",
  projectId: "family-budget-fda7b",
  storageBucket: "family-budget-fda7b.firebasestorage.app",
  messagingSenderId: "736951783389",
  appId: "1:736951783389:web:9bd244b07e142097637034"
};
const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ── 家庭共用帳號：這個 email 要和 Firebase Authentication 裡建立的使用者一致 ──
// （密碼不寫在程式裡，存在 Firebase，只有輸入正確才能讀寫資料）
const FAMILY_EMAIL = 'family@jiazhangben.app';

// ── helpers ───────────────────────────────────────────
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n){ return 'NT$'+Math.abs(Number(n)||0).toLocaleString('zh-TW',{maximumFractionDigits:0}); }
function sfmt(n){ return (Number(n)<0?'-':'')+fmt(n); }
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function monthKey(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
function showToast(msg,dur=2200){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),dur); }
function fmtDateLabel(s){
  if(!s) return ''; s=String(s).substring(0,10);
  const [y,mo,d]=s.split('-').map(Number); if(!y||!mo||!d) return s;
  const dt=new Date(y,mo-1,d);
  const wd=['日','一','二','三','四','五','六'][dt.getDay()];
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((dt-now)/86400000);
  if(diff===0) return `今天（週${wd}）`;
  if(diff===-1) return `昨天（週${wd}）`;
  return `${mo}月${d}日（週${wd}）`;
}
function cleanDate(s){ return s?String(s).substring(0,10):''; }
function sortTxs(){ S.txs.sort((a,b)=>cleanDate(b.date).localeCompare(cleanDate(a.date))||(b.createdAt||0)-(a.createdAt||0)); }

// ── 分類 ──────────────────────────────────────────────
const CATS={
  expense:[
    {id:'food',icon:'🍱',name:'餐飲'},{id:'transport',icon:'🚌',name:'交通'},
    {id:'shop',icon:'🛒',name:'購物'},{id:'medical',icon:'💊',name:'醫療'},
    {id:'edu',icon:'📚',name:'教育'},{id:'fun',icon:'🎮',name:'娛樂'},
    {id:'home',icon:'🏠',name:'居家'},{id:'beauty',icon:'💄',name:'美妝'},
    {id:'pet',icon:'🐾',name:'寵物'},{id:'card',icon:'💳',name:'卡費'},
    {id:'other',icon:'📦',name:'其他'},
  ],
  income:[
    {id:'salary',icon:'💼',name:'薪水'},{id:'bonus',icon:'🎁',name:'獎金'},
    {id:'invest',icon:'💰',name:'股利/投資'},{id:'side',icon:'🛠️',name:'兼職'},
    {id:'gift',icon:'🧧',name:'紅包'},{id:'other_i',icon:'✨',name:'其他'},
  ]
};
function catList(type){ return type==='inc'?CATS.income:CATS.expense; }
function defaultCat(type){ return type==='inc'?'other_i':'other'; }
// 依交易類型取分類（舊資料裡收入被存成 'other' 也會正確顯示成收入的「其他」）
function normCatId(t){
  if(t.type==='xfr') return '';
  const list=catList(t.type);
  return list.some(c=>c.id===t.category)?t.category:defaultCat(t.type);
}
function catById(id){ return [...CATS.expense,...CATS.income].find(c=>c.id===id)||{icon:'📦',name:'其他'}; }
function catOf(t){ return catById(normCatId(t)); }

const ACC_TYPES=[
  {id:'bank',icon:'🏦',label:'銀行帳戶',bg:'#EBF0FD'},
  {id:'cash',icon:'💵',label:'現金',bg:'#E6F4EE'},
  {id:'card',icon:'💳',label:'信用卡',bg:'#FFF3E0'},
  {id:'invest',icon:'📈',label:'股票帳戶',bg:'#F3E5F5'},
  {id:'reserve',icon:'🐷',label:'買股預備金',bg:'#FCE4EC'},
  {id:'other',icon:'📂',label:'其他',bg:'#EAEDF2'},
];
function accTypeById(id){ return ACC_TYPES.find(t=>t.id===id)||ACC_TYPES.find(t=>t.id==='other'); }

// ── 股票 ──────────────────────────────────────────────
// 買股、賣股存成「轉帳」（不算收支），領股利存成「收入」；用 stock 欄位標記
const STK={
  buy: {icon:'📈',name:'買股票',hint:'錢從扣款帳戶轉進股票帳戶，不算支出'},
  sell:{icon:'💵',name:'賣股票',hint:'賣出的錢從股票帳戶回到銀行，不算收入'},
  div: {icon:'💰',name:'領股利',hint:'股利入帳，會算進收入'},
};
function isStockAcc(a){ return a?.type==='invest'; }
function stockAccs(){ return S.accounts.filter(isStockAcc); }
function cashAccs(){ return S.accounts.filter(a=>!isStockAcc(a)); }
function sumAmt(list){ return list.reduce((s,t)=>s+(Number(t.amount)||0),0); }
// 每筆記錄的顯示方式（圖示、名稱、顏色、帳戶）
function txInfo(t){
  const acc=S.accounts.find(a=>a.id===t.accountId);
  const toAcc=t.toAccountId?S.accounts.find(a=>a.id===t.toAccountId):null;
  const an=a=>esc(a?.name||'未知帳戶');
  const k=t.stock&&STK[t.stock];
  if(k&&t.stock==='div') return {icon:k.icon,kind:k.name,title:t.desc||k.name,bg:'var(--stk-l)',cls:'inc',sign:'＋',color:'var(--green)',accLabel:an(acc),
    rows:[['入帳帳戶',an(acc)]]};
  if(k) return {icon:k.icon,kind:k.name,title:t.desc||k.name,bg:'var(--stk-l)',cls:'stk',sign:'',color:'var(--stk)',accLabel:`${an(acc)} → ${an(toAcc)}`,
    rows:t.stock==='buy'?[['扣款帳戶',an(acc)],['股票帳戶',an(toAcc)]]:[['股票帳戶',an(acc)],['入帳帳戶',an(toAcc)]]};

    rows:[['轉出',an(acc)],['轉入',an(toAcc)]]};

}

// ── computed ──────────────────────────────────────────
function accountBalance(accId){
  const acc=S.accounts.find(a=>a.id===accId); if(!acc) return 0;
  let bal=Number(acc.initBalance)||0;
  for(const t of S.txs){
    const amt=Number(t.amount)||0;
    if(t.type==='inc'&&t.accountId===accId) bal+=amt;
    if(t.type==='exp'&&t.accountId===accId) bal-=amt;
    if(t.type==='xfr'&&t.accountId===accId) bal-=amt;
    if(t.type==='xfr'&&t.toAccountId===accId) bal+=amt;
  }
  return bal;
}
function txsOfAccount(id){ return S.txs.filter(t=>t.accountId===id||t.toAccountId===id); }
function monthTxs(){
  const mk=monthKey(S.txYear,S.txMonth);
  return S.txs.filter(t=>cleanDate(t.date).startsWith(mk));
}

// ── 即時同步 ───────────────────────────────────────────
let unsubs=[];
function stopListeners(){ unsubs.forEach(u=>u()); unsubs=[]; }
function startListeners(){
  let gotA=false, gotT=false, denied=false;
  const onErr=e=>{
    if(e.code==='permission-denied'){ if(!denied){ denied=true; stopListeners(); renderDenied(); } }
    else showToast('載入失敗：'+e.message,3500);
  };
  const ready=()=>{
    if(!gotA||!gotT||denied) return;
    document.getElementById('bnav').style.display='flex';
    render();
  };
  unsubs.push(onSnapshot(collection(db,'accounts'),snap=>{
    S.accounts=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    gotA=true; ready();
  },onErr));
  unsubs.push(onSnapshot(collection(db,'txs'),snap=>{
    S.txs=snap.docs.map(d=>({id:d.id,...d.data()})); sortTxs();
    gotT=true; ready();
  },onErr));
}

onAuthStateChanged(auth,u=>{
  stopListeners();
  document.querySelectorAll('.backdrop').forEach(b=>b.remove());
  if(!u){ S.user=null; S.accounts=[]; S.txs=[]; renderLogin(); return; }
  S.user={id:u.uid,name:''};
  renderUserChip();
  document.getElementById('main').innerHTML='<div class="loading">載入中…</div>';
  startListeners();
});

// ── 新增/編輯記帳 modal ───────────────────────────────
let _txType='exp';   // 表單模式：exp 支出、inc 收入、xfr 轉帳、stk 股票
let _stkKind='buy';  // 股票模式下：buy 買、sell 賣、div 股利

// ── 金額計算機 ─────────────────────────────────────────
let _amt='';          // 算式字串，例如 "120+35×2"
let _padOpen=true;
let _allowNeg=false;  // 帳戶餘額可以是負數（信用卡欠款），記帳金額不行
const OPS='+-×÷';
function isOp(c){ return OPS.includes(c); }
// 依先乘除後加減計算；結尾多出的運算符號會忽略
function calcEval(expr){
  let s=String(expr||'').replace(/[+\-×÷]+$/,'');
  if(!s) return NaN;
  if(s[0]==='-') s='0'+s;
  const parts=s.split(/([+\-×÷])/).filter(x=>x!=='');
  const nums=[parseFloat(parts[0])], ops=[];
  for(let i=1;i<parts.length;i+=2){
    const op=parts[i], n=parseFloat(parts[i+1]);
    if(isNaN(n)) return NaN;
    const k=nums.length-1;
    if(op==='×') nums[k]*=n;
    else if(op==='÷'){ if(n===0) return NaN; nums[k]/=n; }
    else { ops.push(op); nums.push(n); }
  }
  let r=nums[0];
  ops.forEach((op,i)=>{ r=op==='+'?r+nums[i+1]:r-nums[i+1]; });
  return isFinite(r)?Math.round(r*100)/100:NaN;
}
function fmtNum(n){ return Number(n).toLocaleString('zh-TW',{maximumFractionDigits:2}); }
function calcPress(k){
  const last=_amt.slice(-1);
  const curNum=_amt.split(/[+\-×÷]/).pop();
  if(k==='C'){ _amt=''; }
  else if(k==='⌫'){ _amt=_amt.slice(0,-1); }
  else if(k==='='){
    if(!/[+\-×÷]/.test(_amt.replace(/[+\-×÷]+$/,''))){ _amt=_amt.replace(/[+\-×÷]+$/,''); }
    else{
      const r=calcEval(_amt);
      if(isNaN(r)){ showToast('算式有誤（不能除以 0）'); return; }
      if(r<0&&!_allowNeg){ showToast('結果是負數，請檢查算式'); return; }
      _amt=String(r);
    }
  }
  else if(isOp(k)){
    if(!_amt||_amt==='-'){                    // 開頭只能是負號（且只限餘額欄位）
      if(k==='-'&&_allowNeg) _amt='-';
      updateCalc(); return;
    }
    _amt=isOp(last)?_amt.slice(0,-1)+k:_amt+k; // 連按符號就替換
  }
  else if(k==='.'){
    if(curNum.includes('.')) return;
    _amt+=(curNum===''?'0.':'.');
  }
  else{ // 數字
    if(_amt.length>=40) return;
    if(curNum==='0'&&k!=='.') _amt=_amt.slice(0,-1)+k; // 避免 007
    else _amt+=k;
  }
  updateCalc();
}
function updateCalc(){
  const ex=document.getElementById('calc-expr'), rs=document.getElementById('calc-res');
  if(!ex) return;
  ex.textContent=(_amt||'0').replace(/-/g,'−');
  ex.classList.toggle('ph',!_amt);
  const hasOp=/[+\-×÷]/.test(_amt.replace(/[+\-×÷]+$/,''));
  const r=calcEval(_amt);
  rs.textContent=hasOp?(isNaN(r)?'= ?':'= '+fmtNum(r)):'';
}
function toggleCalc(){
  _padOpen=!_padOpen;
  document.getElementById('calc-pad')?.classList.toggle('hide',!_padOpen);
}
function calcFieldHTML(){
  return `<div class="calc-disp" onclick="toggleCalc()">
        <div class="calc-expr" id="calc-expr"></div>
        <div class="calc-res" id="calc-res"></div>
      </div>
      ${calcPadHTML()}`;
}
function setCalcValue(n){
  const v=Number(n);
  _amt=(n===''||n==null||isNaN(v))?'':String(Math.round(v*100)/100);
}
function calcPadHTML(){
  const b=(k,cls='')=>`<button type="button" class="ck ${cls}" onclick="calcPress('${k}')">${k==='-'?'−':k}</button>`;
  return `<div class="calc-pad${_padOpen?'':' hide'}" id="calc-pad">
    ${b('C','fn')}${b('⌫','fn')}${b('÷','op')}${b('×','op')}
    ${b('7')}${b('8')}${b('9')}${b('-','op')}
    ${b('4')}${b('5')}${b('6')}${b('+','op')}
    ${b('1')}${b('2')}${b('3')}${b('=','eq')}
    <button type="button" class="ck" style="grid-column:span 2" onclick="calcPress('0')">0</button>${b('.')}
    <button type="button" class="ck fn" onclick="toggleCalc()">收起</button>
  </div>`;
}
// 電腦鍵盤也能輸入（游標不在其他輸入框時）
document.addEventListener('keydown',e=>{
  if(!document.getElementById('calc-expr')) return;
  const ae=document.activeElement;
  if(ae&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName)) return;
  const map={'*':'×','x':'×','/':'÷','Enter':'=','Backspace':'⌫','Escape':'C','Delete':'C'};
  const k=map[e.key]||e.key;
  if(/^[0-9.]$/.test(k)||isOp(k)||k==='='||k==='⌫'||k==='C'){
    e.preventDefault(); calcPress(k);
  }
});

function openTxModal(){
  if(S.accounts.length===0){ showToast('請先新增帳戶'); switchTab('assets'); return; }
  _txType='exp'; _stkKind='buy'; _padOpen=true;
  const bd=mkBackdrop('tx-modal-bd');
  bd.innerHTML=buildTxHTML(null,'');
  document.body.appendChild(bd);
  updateCalc();
}

function openEditTx(id){
  const t=S.txs.find(x=>x.id===id); if(!t) return;
  document.getElementById('tx-detail-bd')?.remove();
  _txType=t.stock?'stk':t.type; _stkKind=t.stock||'buy'; _padOpen=false;
  const bd=mkBackdrop('tx-modal-bd');
  bd.innerHTML=buildTxHTML({...t,category:normCatId(t)},id);
  document.body.appendChild(bd);
  updateCalc();
}

// v = 表單目前的值（新增時為 null）；editId = 編輯中的記錄 id（新增時為空字串）
function accOpts(list,sel){ return list.map(a=>`<option value="${esc(a.id)}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join(''); }
function pickAcc(list,...cands){ for(const c of cands){ if(c&&list.some(a=>a.id===c)) return c; } return list[0]?.id||''; }
function stockFieldsHTML(v){
  const sk=_stkKind, stocks=stockAccs(), cashes=cashAccs();
  const kb=k=>`<button type="button" class="stk-btn${sk===k?' sel':''}" onclick="setStkKind('${k}')">${STK[k].icon}<span class="cn">${STK[k].name}</span></button>`;
  let accHTML='';
  if(sk!=='div'&&stocks.length===0){
    accHTML=`<div class="notice">還沒有股票帳戶<br>先建一個，買賣股票的錢才有地方放
      <br><button type="button" onclick="openAccModal('','invest')">＋ 建立股票帳戶</button></div>`;
  }else if(sk==='buy'){
    const from=pickAcc(cashes,v?.accountId,v?.toAccountId), to=pickAcc(stocks,v?.toAccountId,v?.accountId);
    accHTML=`<div class="fgrp"><label class="flabel">扣款帳戶（錢從哪裡出）</label><select class="finput" id="tx-acc">${accOpts(cashes,from)}</select></div>
      <div class="fgrp"><label class="flabel">股票帳戶</label><select class="finput" id="tx-acc-to">${accOpts(stocks,to)}</select></div>`;
  }else if(sk==='sell'){
    const from=pickAcc(stocks,v?.accountId,v?.toAccountId), to=pickAcc(cashes,v?.toAccountId,v?.accountId);
    accHTML=`<div class="fgrp"><label class="flabel">股票帳戶</label><select class="finput" id="tx-acc">${accOpts(stocks,from)}</select></div>
      <div class="fgrp"><label class="flabel">入帳帳戶（錢回到哪裡）</label><select class="finput" id="tx-acc-to">${accOpts(cashes,to)}</select></div>`;
  }else{
    const acc=pickAcc(cashes,v?.accountId,v?.toAccountId);
    accHTML=`<div class="fgrp"><label class="flabel">入帳帳戶（股利匯到哪裡）</label><select class="finput" id="tx-acc">${accOpts(cashes,acc)}</select></div>`;
  }
  return `<div class="fgrp"><label class="flabel">要記什麼？</label>
      <div class="stk-row">${kb('buy')}${kb('sell')}${kb('div')}</div>
      <div class="stk-hint">${STK[sk].hint}</div></div>
    <div class="fgrp"><label class="flabel">金額${sk==='buy'?'（當天扣款總額）':''}</label>
      ${calcFieldHTML()}</div>
    ${accHTML}`;
}
function buildTxHTML(v,editId){
  const isEdit=!!editId;
  _allowNeg=false;
  _amt=(v&&v.amount!=null&&v.amount!=='')?String(v.amount):'';
  const tb=(k,l)=>`<button class="type-btn${_txType===k?' on-'+k:''}" onclick="setTxType('${k}','${editId}')">${l}</button>`;
  let body;
  if(_txType==='stk'){
    body=stockFieldsHTML(v);
  }else{
    const all=S.accounts;
    const fromId=pickAcc(all,v?.accountId);
    let toId=v?.toAccountId||'';
    if(!toId||toId===fromId||!all.some(a=>a.id===toId)) toId=(all.find(a=>a.id!==fromId)||all[0])?.id||'';
    const cats=catList(_txType);
    const hasCat=v&&cats.some(c=>c.id===v.category);
    const catBtns=cats.map((c,i)=>{
      const sel=hasCat?c.id===v.category:i===0;
      return `<button class="cat-btn${sel?' sel':''}" data-id="${c.id}" onclick="selCat(this)">${c.icon}<span class="cn">${c.name}</span></button>`;
    }).join('');
    body=`<div class="fgrp"><label class="flabel">金額</label>
      ${calcFieldHTML()}</div>
    ${_txType!=='xfr'?`<div class="fgrp"><label class="flabel">分類</label><div class="cat-grid">${catBtns}</div></div>`:''}
    <div class="fgrp"><label class="flabel">${_txType==='xfr'?'轉出帳戶':'帳戶'}</label>
      <select class="finput" id="tx-acc">${accOpts(all,fromId)}</select></div>
    ${_txType==='xfr'?`<div class="fgrp"><label class="flabel">轉入帳戶</label>
      <select class="finput" id="tx-acc-to">${accOpts(all,toId)}</select></div>`:''}`;
  }
  return `<div class="modal" id="tx-modal-inner" data-edit="${esc(editId)}">
    <div class="modal-hdr"><h3>${isEdit?'編輯記帳':'新增記帳'}</h3>
      <button class="close-btn" onclick="document.getElementById('tx-modal-bd').remove()">✕</button></div>
    <div class="type-row">${tb('exp','支出')}${tb('inc','收入')}${tb('stk','股票')}${tb('xfr','轉帳')}</div>
    ${body}
    <div class="fgrp"><label class="flabel">備註（選填）</label>
      <input class="finput" id="tx-desc" placeholder="可空白" value="${esc(v?.desc||'')}"></div>
    <div class="fgrp"><label class="flabel">日期</label>
      <input class="finput" id="tx-date" type="date" value="${esc(v?.date?cleanDate(v.date):today())}"></div>
    <button class="submit-btn" id="tx-submit" onclick="saveTx('${editId}')">${isEdit?'儲存修改':'記帳'}</button>
  </div>`;
}

function readTxForm(){
  const g=id=>document.getElementById(id);
  const f={
    amount:_amt,
    accountId:g('tx-acc')?.value||'',
    desc:g('tx-desc')?.value??'',
    date:g('tx-date')?.value||'',
  };
  if(g('tx-acc-to')) f.toAccountId=g('tx-acc-to').value;
  const c=document.querySelector('#tx-modal-inner .cat-btn.sel')?.dataset.id;
  if(c) f.category=c;
  return f;
}
// 切換類型時保留已經填好的金額、帳戶、備註、日期
function setTxType(t,editId){
  const cur=readTxForm();
  _txType=t;
  const inner=document.getElementById('tx-modal-inner');
  if(inner) inner.outerHTML=buildTxHTML(cur,editId);
  updateCalc();
}
function setStkKind(k){
  const inner=document.getElementById('tx-modal-inner'); if(!inner) return;
  const cur=readTxForm();
  _stkKind=k;
  inner.outerHTML=buildTxHTML(cur,inner.dataset.edit||'');
  updateCalc();
}
function selCat(btn){
  document.querySelectorAll('#tx-modal-inner .cat-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

async function saveTx(editId){
  const f=readTxForm();
  const amount=calcEval(f.amount);
  if(isNaN(amount)&&f.amount){ showToast('算式有誤，請檢查金額'); return; }
  if(!amount||amount<=0){ showToast('請輸入金額'); return; }
  let type=_txType, stock='', category='', accId=f.accountId, toAccId='';
  if(_txType==='stk'){
    stock=_stkKind;
    if(stock==='div'){ type='inc'; category='invest'; }
    else{ type='xfr'; toAccId=f.toAccountId||''; }
    if(stock!=='div'&&stockAccs().length===0){ showToast('請先建立股票帳戶'); return; }
    if(cashAccs().length===0){ showToast('請先新增銀行帳戶'); return; }
  }else if(_txType==='xfr'){
    toAccId=f.toAccountId||'';
  }else{
    category=catList(type).some(c=>c.id===f.category)?f.category:defaultCat(type);
  }
  if(!accId){ showToast('請選擇帳戶'); return; }
  if(type==='xfr'&&!toAccId){ showToast('請選擇轉入帳戶'); return; }
  if(type==='xfr'&&toAccId===accId){ showToast('轉出和轉入帳戶不能相同'); return; }
  if(!f.date){ showToast('請選擇日期'); return; }
  const btn=document.getElementById('tx-submit'); if(btn) btn.disabled=true;
  const base={type,stock,amount,accountId:accId,toAccountId:toAccId,desc:f.desc.trim(),date:f.date,category};
  try{
    if(editId){
      const t=S.txs.find(x=>x.id===editId);
      await updateDoc(doc(db,'txs',editId),{
        ...base,
        userId:t?.userId||S.user.id, userName:t?.userName||S.user.name,
        createdAt:t?.createdAt||Date.now()
      });
      showToast('已更新 ✓');
    }else{
      await addDoc(collection(db,'txs'),{...base,userId:S.user.id,userName:S.user.name,createdAt:Date.now()});
      showToast('記帳成功 ✓');
    }
    document.getElementById('tx-modal-bd')?.remove();
  }catch(e){ showToast('失敗：'+e.message); if(btn) btn.disabled=false; }
}

// ── 統計頁 ────────────────────────────────────────────
function renderStats(){
  const mTxs=monthTxs();
  const expTxs=mTxs.filter(t=>t.type==='exp');
  const incTxs=mTxs.filter(t=>t.type==='inc');
  const totalExp=expTxs.reduce((s,t)=>s+Number(t.amount),0);
  const totalInc=incTxs.reduce((s,t)=>s+Number(t.amount),0);
  function groupByCat(txs,total){
    const map={};
    for(const t of txs){ const k=normCatId(t); map[k]=(map[k]||0)+Number(t.amount); }
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([id,amt])=>({
      cat:catById(id), amt, pct:total>0?Math.round(amt/total*100):0
    }));
  }
  function catRows(groups,color){
    if(!groups.length) return '<div style="color:var(--text3);font-size:13px;padding:8px 0">無資料</div>';
    return groups.map(g=>`
      <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:18px;width:24px;text-align:center">${g.cat.icon}</span>
        <span style="flex:1;font-size:13px">${g.cat.name}</span>
        <div style="width:72px;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden">
          <div style="width:${g.pct}%;height:100%;background:${color};border-radius:99px"></div>
        </div>
        <span style="font-family:var(--mono);font-size:12px;color:var(--text2);width:76px;text-align:right">${fmt(g.amt)}</span>
      </div>`).join('');
  }
  const bars=[];
  for(let i=5;i>=0;i--){
    let y=S.txYear,m=S.txMonth-i; while(m<1){m+=12;y--;}
    const mk2=monthKey(y,m);
    const inMonth=S.txs.filter(t=>cleanDate(t.date).startsWith(mk2));
    const inc=inMonth.filter(t=>t.type==='inc').reduce((s,t)=>s+Number(t.amount),0);
    const exp=inMonth.filter(t=>t.type==='exp').reduce((s,t)=>s+Number(t.amount),0);
    bars.push({label:`${m}月`,inc,exp,net:inc-exp});
  }
  const sBuy=sumAmt(mTxs.filter(t=>t.stock==='buy'));
  const sSell=sumAmt(mTxs.filter(t=>t.stock==='sell'));
  const sDiv=sumAmt(mTxs.filter(t=>t.stock==='div'));
  const sRow=(icon,l,v,c)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:18px;width:24px;text-align:center">${icon}</span><span style="flex:1;font-size:13px">${l}</span>
      <span style="font-family:var(--mono);font-size:13px;color:${c}">${v}</span></div>`;
  const stockCard=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px">股票（本月）</div>
      ${sRow('📈','買進',fmt(sBuy),'var(--stk)')}
      ${sRow('💵','賣出',fmt(sSell),'var(--text2)')}
      ${sRow('💰','股利',fmt(sDiv),'var(--green)')}
      <div style="font-size:12px;color:var(--text3);margin-top:8px">淨投入 ${sfmt(sBuy-sSell)}（買進 − 賣出）。買賣股票不算進上面的收支。</div>
    </div>`;
  const maxVal=Math.max(...bars.map(b=>Math.max(b.inc,b.exp)),1);
  const barHtml=bars.map(b=>{
    const hi=Math.round(b.inc/maxVal*60); const he=Math.round(b.exp/maxVal*60);
    const nc=b.net>=0?'var(--green)':'var(--red)';
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1">
      <div style="font-size:9px;color:${nc};font-family:var(--mono)">${b.net!==0?(b.net>=0?'+':'-')+Math.round(Math.abs(b.net)/1000)+'k':''}</div>
      <div style="display:flex;align-items:flex-end;gap:2px;height:60px">
        <div style="width:10px;background:var(--green);border-radius:3px 3px 0 0;height:${hi}px;opacity:.75"></div>
        <div style="width:10px;background:var(--red);border-radius:3px 3px 0 0;height:${he}px;opacity:.75"></div>
      </div>
      <div style="font-size:10px;color:var(--text3)">${b.label}</div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML=`
    ${monthBar()}
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:14px">近六個月收支</div>
      <div style="display:flex;gap:4px;align-items:flex-end">${barHtml}</div>
      <div style="display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--text3)">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--green);opacity:.75;margin-right:4px"></span>收入</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--red);opacity:.75;margin-right:4px"></span>支出</span>
      </div>
    </div>
    ${stockCard}
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px">支出分類（共 ${fmt(totalExp)}）</div>
      ${catRows(groupByCat(expTxs,totalExp),'var(--red)')}
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px">收入分類（共 ${fmt(totalInc)}）</div>
      ${catRows(groupByCat(incTxs,totalInc),'var(--green)')}
    </div>`;
}

// ── 工具函式 ──────────────────────────────────────────
function mkBackdrop(id){
  document.getElementById(id)?.remove();
  const bd=document.createElement('div');
  bd.className='backdrop'; bd.id=id;
  bd.onclick=e=>{ if(e.target===bd) bd.remove(); };
  return bd;
}
